# 初始配置：仅 HTTP（用于首次启动 + 申请证书）
# 拿到证书后，用 nginx.https.conf 覆盖本文件并重启 nginx。
#
# 关键点：SSE 流式输出必须关闭 proxy_buffering，否则前端会「卡住」到整段结束才显示。

# 上游若是 Cloudflare Tunnel / 其他反代，它会带 X-Forwarded-Proto: https；
# 直连时该头为空，回落到 $scheme。Next.js / Clerk 靠这个头判断是否 HTTPS。
map $http_x_forwarded_proto $edith_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 挑战
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edith_forwarded_proto;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "";

        # SSE：不缓冲 + 长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
